<script>
document.addEventListener("DOMContentLoaded", function() {
  var sidebar = document.querySelector(".sidebar-book");
  if (!sidebar) return;

  // Create a slim tab on the left edge — visible, unobtrusive, clearly a toggle
  var btn = document.createElement("button");
  btn.innerHTML = '&#9776; Contents';
  btn.setAttribute("aria-label", "Toggle table of contents");
  btn.id = "sidebar-toggle-btn";
  document.body.appendChild(btn);

  var isOpen = false;

  function openSidebar() {
    isOpen = true;
    sidebar.classList.add("sidebar-open");
    btn.innerHTML = '&times; Close';
    btn.classList.add("sidebar-toggle-active");
  }

  function closeSidebar() {
    isOpen = false;
    sidebar.classList.remove("sidebar-open");
    btn.innerHTML = '&#9776; Contents';
    btn.classList.remove("sidebar-toggle-active");
  }

  btn.addEventListener("click", function(e) {
    e.stopPropagation();
    if (isOpen) { closeSidebar(); } else { openSidebar(); }
  });

  // Close when clicking outside
  document.addEventListener("click", function(e) {
    if (isOpen && !sidebar.contains(e.target) && e.target !== btn) {
      closeSidebar();
    }
  });

  // Close on Escape key
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && isOpen) { closeSidebar(); }
  });

  // Only activate on wide screens
  function checkWidth() {
    if (window.innerWidth >= 992) {
      btn.style.display = "flex";
      sidebar.classList.add("sidebar-collapsed");
    } else {
      btn.style.display = "none";
      sidebar.classList.remove("sidebar-collapsed");
      sidebar.classList.remove("sidebar-open");
    }
  }

  window.addEventListener("resize", checkWidth);
  checkWidth();
});
</script>
